<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketOps</title>
    <link rel="stylesheet" href="style.css">
</head>
<header>
   <a href="index.html"><img src="img/logo.png" alt="Logo de MarketOps" width="100"></a>
</header>
<main>
<body>
    <h1 class="titulo"><center>Ofertas TOP disponibles</center> </h1>
    <div class="slider-box">
        <ul>
            <li>
                <img src="img/arroz.jpg" alt="Arroz Tucapel">
            </li>
            <li>
                <img src="img/Carnes.jpg" alt="Lomo vetado o liso">
            </li>
        </ul>
    </div>
    <div class="registro">
    <form id="registro-form">
        <h2>Registro de Usuario</h2>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br>
        
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
        <br>
        
        <button type="submit">Registrarse</button>
    </form>
    </div>
</main>
<footer>
    <p>© 2026 MarketOps. Todos los derechos reservados.</p>
</footer>
</body>

<script src="js/registro.js"></script>
</html>
